<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeonexaLabs</title>
<meta name="description" content="NeonexaLabs: games for your phone. Home of Handle With Curse.">
<style>
:root{--bg:#120d1a;--panel:#1d1428;--border:#5a3d8a;--text:#f5e8c8;--muted:#a99bbf;--accent:#ffd25a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:17px/1.65 "Open Sans","Noto Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  background-image:radial-gradient(circle at 85% -5%,rgba(138,99,210,.22),transparent 45%),linear-gradient(#17102199,var(--bg) 420px)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 56px}
header{text-align:center;padding:56px 0 8px}
.moon{width:54px;height:54px;border-radius:50%;background:#c9bda8;margin:0 auto 18px;box-shadow:0 0 36px rgba(245,232,200,.28)}
h1{margin:0;font-size:clamp(34px,8vw,48px);line-height:1.1;color:var(--accent);font-weight:700;text-shadow:3px 3px 0 #7a47c9}
.sub{margin:10px 0 0;color:var(--muted);font-size:17px;letter-spacing:.14em;text-transform:uppercase}
.card{margin:36px 0 0;padding:6px 22px 18px;background:var(--panel);border:2px solid var(--border);border-radius:14px}
h2{margin:16px 0 6px;font-size:23px;line-height:1.25;color:var(--accent)}
p{margin:8px 0;overflow-wrap:break-word}
a{color:var(--accent);text-underline-offset:3px}
a:hover{color:#fff1c2}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
footer{margin-top:40px;text-align:center;color:var(--muted);font-size:15px}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="moon" aria-hidden="true"></div>
<h1>NeonexaLabs</h1>
<p class="sub">Games for your phone</p>
</header>
<main>
<section class="card">
<h2>Handle With Curse</h2>
<p>A mobile game about running a cursed antique shop: sell the antiques before they go off.</p>
<p><a href="https://neonexalabs.github.io/handle-with-curse-privacy/">Privacy policy</a></p>
</section>
</main>
<footer>
<p>Contact: <a href="mailto:neonexalabs@gmail.com">neonexalabs@gmail.com</a></p>
</footer>
</div>
</body>
</html>
