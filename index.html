<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neonexa Labs</title>
<meta name="description" content="Neonexa Labs: games for your phone. Home of Handle With Curse.">
<meta name="theme-color" content="#120d1a">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/assets/icon-512.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Neonexa Labs">
<meta property="og:description" content="Games for your phone. Home of Handle With Curse.">
<meta property="og:url" content="https://neonexalabs.github.io/">
<meta property="og:image" content="https://neonexalabs.github.io/assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--bg:#120d1a;--panel:#1a1630;--border:#4b3fa0;--text:#eeeaf8;--muted:#a9a3c4;--accent:#5ee7ff;--accent2:#a970ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:17px/1.65 "Open Sans","Noto Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  background-image:radial-gradient(circle at 85% -5%,rgba(169,112,255,.22),transparent 45%),radial-gradient(circle at 10% 10%,rgba(94,231,255,.10),transparent 40%),linear-gradient(#17102199,var(--bg) 420px)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 56px}
header{text-align:center;padding:48px 0 8px}
h1{margin:0;line-height:0}
.logo{display:block;width:min(280px,72vw);height:auto;margin:0 auto;filter:drop-shadow(0 0 28px rgba(94,231,255,.18))}
.sub{margin:18px 0 0;color:var(--muted);font-size:17px;letter-spacing:.14em;text-transform:uppercase}
.card{margin:36px 0 0;padding:6px 22px 18px;background:var(--panel);border:2px solid var(--border);border-radius:14px}
h2{margin:16px 0 6px;font-size:23px;line-height:1.25;color:var(--accent)}
p{margin:8px 0;overflow-wrap:break-word}
a{color:var(--accent);text-underline-offset:3px}
a:hover{color:#b8f5ff}
:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}
footer{margin-top:40px;text-align:center;color:var(--muted);font-size:15px}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1><img class="logo" src="/assets/logo-light.png" width="640" height="531" alt="Neonexa Labs"></h1>
<p class="sub">Games for your phone</p>
</header>
<main>
<section class="card">
<h2>Handle With Curse</h2>
<p>A mobile game about running a cursed antique shop: sell the antiques before they go off.</p>
<p><a href="https://neonexalabs.github.io/handle-with-curse-privacy/">Privacy policy</a></p>
</section>
</main>
<footer>
<p>Contact: <a href="mailto:neonexalabs@gmail.com">neonexalabs@gmail.com</a></p>
</footer>
</div>
</body>
</html>
